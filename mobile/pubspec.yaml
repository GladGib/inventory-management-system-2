name: ims_mobile
description: Inventory Management System - Mobile App for Warehouse Operations

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3

  # Networking
  dio: ^5.4.0

  # Local Storage
  sqflite: ^2.3.2
  path: ^1.8.3
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0

  # Barcode Scanning
  mobile_scanner: ^4.0.1

  # UI
  cupertino_icons: ^1.0.6
  flutter_spinkit: ^5.2.0

  # Firebase
  firebase_core: ^3.12.1
  firebase_messaging: ^15.2.4

  # Utils
  intl: ^0.19.0
  connectivity_plus: ^5.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  riverpod_generator: ^2.3.9
  build_runner: ^2.4.8
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true
